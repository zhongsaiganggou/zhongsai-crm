services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zhongsai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zhongsai_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhongsai} -d ${POSTGRES_DB:-zhongsai_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zhongsai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zhongsai_crm}?schema=public
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
      - edge

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?请在 .env 中设置 CRM_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
      - edge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  backend:
    internal: true
  edge:
